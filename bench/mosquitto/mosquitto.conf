# 맥용 Mosquitto 설정 예시 (Homebrew: /opt/homebrew/etc/mosquitto/mosquitto.conf)
# 보드가 랜으로 붙어야 하므로 0.0.0.0 으로 열고, 계정 없이는 못 붙게 함
listener 1883 0.0.0.0
allow_anonymous false
password_file /opt/homebrew/etc/mosquitto/passwd
persistence false
log_type error
log_type warning
log_type notice
connection_messages true
