CONFIG_I2C=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_MAIN_STACK_SIZE=6144
# 손으로 버스를 볼 수 있게 (i2c scan i2c@40005400 / i2c@40005800)
CONFIG_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO=y
# 센서 측정 주기 (ms). 100–60000. 바꾸면 다시 빌드 · 굽기. 페이지와 MCP 서버는 로그에서 이 값을 읽어 자동으로 맞춤.
CONFIG_BENCH_SAMPLE_PERIOD_MS=100
# HSC 차압 영점 보정 (켜질 때 자동, 파란 USER 버튼으로 다시). 끄려면 n.
CONFIG_BENCH_HSC_ZERO=y
# ABP2 정압 만점 (Pa). 붙은 센서 부품 범위와 같아야 함: 2.5KG=2500, 006KG=6000.
CONFIG_BENCH_ABP2_MAX_PA=6000

# ---- 이더넷 + MQTT (CONFIG_BENCH_MQTT, 브로커 주소는 Kconfig / 비밀번호는 secrets.conf) ----
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_MQTT_LIB=y
CONFIG_MQTT_KEEPALIVE=60
CONFIG_NET_SHELL=y

# ---- 서버(브로커) 주소. 서버를 옮기면 여기를 새 PC(맥) 주소로 바꾸고 다시 빌드 · 굽기 ----
CONFIG_BENCH_MQTT_BROKER="172.30.1.93"
# HSC 만 따로 더 자주 읽기 (0 = 끔). 주기가 이미 100 ms 라 끔
CONFIG_BENCH_HSC_FAST_MS=0
